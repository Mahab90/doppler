<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste des patients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="sidebar-logo">Echo<span>Cardio</span></div>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Tableau de bord</a>
        <a href="liste.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Liste des fiches</a>
        <a href="patients.html" class="nav-item active"><i class="fa-solid fa-user-injured"></i> Patients</a>
        <a href="fiche.html" class="nav-item"><i class="fa-solid fa-file-medical"></i> Nouvelle fiche</a>
        <a href="users.html" class="nav-item"><i class="fa-solid fa-users"></i> Utilisateurs</a>
    </nav>

    <main class="main">
        <div class="page-header">
            <h1>Patients</h1>
            <div>
                <a href="fiche.html" class="btn btn-ghost"><i class="fa-solid fa-file-medical"></i> Nouvelle fiche</a>
                <button class="btn btn-primary" onclick="openPatientModal()"><i class="fa-solid fa-plus"></i> Nouveau Patient</button>
            </div>
        </div>

        <div class="card card--section" style="margin-bottom:20px">
            <div class="card-title">Recherche</div>
            <div class="search-bar">
                <div class="form-group" style="flex:3;min-width:280px">
                    <label class="form-label" for="patient-query">Nom, prénom, dossier ou téléphone</label>
                    <input type="search" id="patient-query" class="form-control" placeholder="Rechercher un patient…">
                </div>
            </div>
        </div>

        <div class="card card--section">
            <div class="card-header-row">
                <span class="card-title">Liste des patients <span id="patient-count" class="text-muted"></span></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Âge</th>
                            <th>Sexe</th>
                            <th>N° dossier</th>
                            <th>Téléphone</th>
                            <th>Service</th>
                            <th>Fiches</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table">
                        <tr><td colspan="7" class="table-empty">Chargement…</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="patients-pagination" class="pagination"></div>
        </div>
    </main>
</div>

<!-- Modal Nouveau Patient -->
<div id="patient-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div class="modal-content card" style="width:100%; max-width:600px; margin:20px; max-height:90vh; overflow-y:auto;">
        <div class="card-header-row">
            <h2 class="card-title" style="margin:0;">Nouveau Patient</h2>
            <button class="btn btn-ghost" onclick="closePatientModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="form-patient" style="margin-top:20px;">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nom *</label>
                    <input type="text" name="patient_nom" class="form-control" required placeholder="NOM">
                </div>
                <div class="form-group">
                    <label class="form-label">Prénom *</label>
                    <input type="text" name="patient_prenom" class="form-control" required placeholder="Prénom">
                </div>
                <div class="form-group">
                    <label class="form-label">Sexe</label>
                    <select name="sexe" class="form-control">
                        <option value="">—</option>
                        <option value="M">Masculin</option>
                        <option value="F">Féminin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Âge</label>
                    <input type="number" name="age" class="form-control" min="0" max="150">
                </div>
                <div class="form-group">
                    <label class="form-label">Téléphone</label>
                    <input type="tel" name="telephone" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">N° Dossier</label>
                    <input type="text" name="num_dossier" class="form-control">
                </div>
                <div class="form-group" style="grid-column: 1 / -1; display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-ghost" onclick="closePatientModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
if (!requireLogin()) { /* redirect */ }

let currentPage = 1;
let searchTimer = null;

function loadPatients(page = 1) {
    currentPage = page;
    $.get(API + '/patients.php', { page, q: $('#patient-query').val().trim() })
        .done(function(response) {
            const data = Array.isArray(response?.data) ? response.data : [];
            $('#patient-count').text('(' + (response?.total || 0) + ' patient(s))');
            renderPatients(data);
            renderPatientPagination(response?.total || 0, page);
        })
        .fail(function(xhr) {
            $('#patients-table').html('<tr><td colspan="7" class="table-empty">' + escHtml(apiErrorMessage(xhr, 'Erreur de chargement')) + '</td></tr>');
            toast(apiErrorMessage(xhr, 'Impossible de charger les patients'), 'error');
        });
}

function renderPatients(data) {
    if (!data.length) {
        $('#patients-table').html('<tr><td colspan="7" class="table-empty">Aucun patient trouvé</td></tr>');
        return;
    }
    const rows = data.map(patient => `
        <tr>
            <td><strong>${escHtml(patient.nom)} ${escHtml(patient.prenom)}</strong></td>
            <td>${patient.age ?? '—'}</td>
            <td>${patient.sexe === 'M' ? '♂ M' : patient.sexe === 'F' ? '♀ F' : '—'}</td>
            <td>${patient.num_dossier ? escHtml(patient.num_dossier) : '<span class="text-muted">—</span>'}</td>
            <td>${patient.telephone ? escHtml(patient.telephone) : '<span class="text-muted">—</span>'}</td>
            <td>${patient.service ? escHtml(patient.service) : '<span class="text-muted">—</span>'}</td>
            <td>${patient.fiches_count}</td>
        </tr>`).join('');
    $('#patients-table').html(rows);
}

function renderPatientPagination(total, page) {
    const pages = Math.ceil(total / 20);
    if (pages <= 1) { $('#patients-pagination').empty(); return; }
    let html = '';
    for (let i = 1; i <= pages; i++) {
        html += `<button class="btn ${i === page ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="loadPatients(${i})">${i}</button>`;
    }
    $('#patients-pagination').html(html);
}

$('#patient-query').on('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadPatients(1), 250);
});

loadPatients();

function openPatientModal() {
    $('#form-patient')[0].reset();
    $('#patient-modal').css('display', 'flex');
}
function closePatientModal() {
    $('#patient-modal').hide();
}

$('#form-patient').on('submit', function(e) {
    e.preventDefault();
    const data = getFormData($(this));
    data.actor_id = getAuth().user.id;
    data.actor_name = getAuth().user.nom;
    data.actor_role = getAuth().user.role_name;

    const btn = $(this).find('button[type="submit"]');
    btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> Enregistrement...');

    $.post(API + '/patients.php', JSON.stringify(data))
        .done(function(res) {
            toast('Patient créé avec succès', 'success');
            closePatientModal();
            loadPatients(1);
        })
        .fail(function(xhr) {
            toast(apiErrorMessage(xhr, 'Erreur lors de la création'), 'error');
        })
        .always(function() {
            btn.prop('disabled', false).html('<i class="fa-solid fa-save"></i> Enregistrer');
        });
});
</script>
</body>
</html>
